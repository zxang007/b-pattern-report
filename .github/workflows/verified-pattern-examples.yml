name: Verified Pattern Examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "four_h_segment_arc_scan.py"
      - "scan_four_h_segment_arc_market.py"
      - "market_archive_pattern_scan.py"
      - "screen_aria_4h_pattern.py"
      - "verified_examples.csv"
      - "run_verified_example_scans.py"
      - "verify_verified_examples.py"
      - ".github/workflows/verified-pattern-examples.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan verified examples
        run: |
          mkdir -p regression
          python run_verified_example_scans.py \
            --examples verified_examples.csv \
            --out regression/verified_examples_scan.csv \
            --work-dir regression/by_example
          python verify_verified_examples.py \
            --examples verified_examples.csv \
            --csv-file regression/verified_examples_scan.csv

      - name: Upload regression CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-examples-scan
          path: regression
          if-no-files-found: ignore
